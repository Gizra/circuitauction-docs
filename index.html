<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CircuitAuction Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Help documentation for the CircuitAuction backoffice project">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Theme: Vue (similar to GitBook) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Custom styling for GitBook-like hints -->
  <style>
    .hint {
      padding: 12px 24px 12px 30px;
      margin: 2em 0;
      border-left: 4px solid;
      border-radius: 4px;
      position: relative;
    }
    .hint.info {
      background-color: #e7f2fa;
      border-color: #2196f3;
    }
    .hint.warning {
      background-color: #fff4e5;
      border-color: #ff9800;
    }
    .hint.danger {
      background-color: #ffebee;
      border-color: #f44336;
    }
    .hint.success {
      background-color: #e8f5e9;
      border-color: #4caf50;
    }
    /* Feature videos on the release-notes pages */
    .release-video {
      display: block;
      width: 100%;
      max-width: 960px;
      margin: 1em 0 1.5em;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      background: #000;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    // Languages published besides English (folder name = ISO code used by the backoffice).
    var LANGS = ['de'];

    window.$docsify = {
      name: 'CircuitAuction Docs',
      nameLink: { '/de/': '#/de/', '/': '#/' },
      repo: 'https://github.com/Gizra/circuitauction-docs',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: ['/', '/de/'],
      autoHeader: true,
      subMaxLevel: 3,
      maxLevel: 4,
      homepage: 'README.md',

      // Serve the English page when a translated one does not exist (yet).
      fallbackLanguages: LANGS,

      // Order matters: the language rule must come before the generic one,
      // otherwise /de/_sidebar.md is aliased to the English sidebar.
      alias: {
        '/de/(.*/)?_sidebar.md': '/de/_sidebar.md',
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        pathNamespaces: LANGS.map(function (l) { return '/' + l; }),
        placeholder: { '/de/': 'Suchen...', '/': 'Search...' },
        noData: { '/de/': 'Keine Ergebnisse', '/': 'No Results!' },
        depth: 6,
        hideOtherSidebarContent: false
      },

      pagination: {
        previousText: { '/de/': 'Zurück', '/': 'Previous' },
        nextText: { '/de/': 'Weiter', '/': 'Next' },
        crossChapter: true,
        crossChapterText: true,
      },

      copyCode: {
        buttonText: { '/de/': 'Kopieren', '/': 'Copy' },
        errorText: { '/de/': 'Fehler', '/': 'Error' },
        successText: { '/de/': 'Kopiert', '/': 'Copied' }
      },

      // Process GitBook hint blocks
      plugins: [
        function(hook, vm) {
          hook.afterEach(function(html) {
            // Convert GitBook {% hint %} blocks to styled divs.
            // Marked may escape " to &quot; and wrap markers in <p> tags,
            // so the regex tolerates both forms and strips the surrounding <p>.
            html = html.replace(
              /(?:<p>\s*)?\{%\s*hint\s+style=(?:"|&quot;)(\w+)(?:"|&quot;)\s*%\}(?:\s*<\/p>)?([\s\S]*?)(?:<p>\s*)?\{%\s*endhint\s*%\}(?:\s*<\/p>)?/g,
              function(match, style, content) {
                return '<div class="hint ' + style + '">' + content.trim() + '</div>';
              }
            );
            return html;
          });
        },
        // i18n: <html lang/dir> follows the route, and the navbar language links
        // keep the current page instead of jumping to the language home.
        function (hook, vm) {
          var RTL = ['he'];
          function langOf(path) {
            var m = path.match(/^\/([a-z]{2}(?:-[a-z]+)?)(?:\/|$)/);
            return m && LANGS.indexOf(m[1]) !== -1 ? m[1] : '';
          }
          // Under a /<lang>/ route docsify resolves image links against the ROUTE's parent
          // folder, not the markdown file, and keeps only links containing `:` or `//` as
          // they are (a leading `/` is still relative). Fallback pages (English text served
          // from fallbackLanguages) keep the /de/ route, so their `../assets/x.png` would
          // end up in /de/assets/. Normalise every asset link to the depth-correct relative
          // form: one `../` per folder of the route's parent path (`/de/tasks` -> 1,
          // `/de/auction/x` -> 2), which resolves to the site-root assets folder.
          hook.beforeEach(function (md) {
            var path = vm.route.path || '/';
            if (!langOf(path)) return md;
            var segs = path.split('/').filter(Boolean);
            if (path.slice(-1) !== '/') segs.pop();
            var up = new Array(segs.length + 1).join('../');
            return md
              .replace(/\]\((<?)(?:\.\.\/|\/)*((?:\.gitbook\/)?assets\/)/g, function (m, lt, p) { return '](' + lt + up + p; })
              .replace(/(src=["'])(?:\.\.\/|\/)*((?:\.gitbook\/)?assets\/)/g, function (m, q, p) { return q + up + p; });
          });
          // Localized screenshots: on a /<lang>/ route point every app screenshot at
          // assets/screenshots/<lang>/<name>; when that capture does not exist, onerror
          // swaps back (once) to the English file, so there is never a broken image.
          // Done on the rendered HTML (before the zoom-image plugin binds in doneEach).
          hook.afterEach(function (html) {
            var cur = langOf(vm.route.path || '/');
            if (!cur) return html;
            return html.replace(
              /(<img\b[^>]*?\ssrc=")([^"]*?assets\/screenshots\/)([^"\/]+)"/g,
              function (m, pre, dir, name) {
                var orig = dir + name;
                return pre + dir + cur + '/' + name + '" onerror="this.onerror=null;this.src=\'' +
                  orig.replace(/'/g, '%27') + '\'"';
              }
            );
          });
          hook.doneEach(function () {
            var path = vm.route.path || '/';
            var cur = langOf(path);
            var rest = cur ? path.slice(cur.length + 1) || '/' : path;
            document.documentElement.lang = cur || 'en';
            document.documentElement.dir = RTL.indexOf(cur) !== -1 ? 'rtl' : 'ltr';
            document.querySelectorAll('.app-nav a').forEach(function (a) {
              var m = (a.getAttribute('href') || '').match(/^#\/([a-z]{2}(?:-[a-z]+)?)?\/?$/);
              if (!m) return;
              var target = m[1] || '';
              if (target && LANGS.indexOf(target) === -1) return;
              a.setAttribute('href', '#' + (target ? '/' + target : '') + rest);
            });
          });
        }
      ]
    }
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Copy code plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>

  <!-- Pagination plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Zoom image plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

  <!-- Emoji plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
