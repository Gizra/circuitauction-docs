<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CircuitAuction Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Help documentation for the CircuitAuction backoffice project">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Theme: Vue (similar to GitBook) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Custom styling for GitBook-like hints -->
  <style>
    .hint {
      padding: 12px 24px 12px 30px;
      margin: 2em 0;
      border-left: 4px solid;
      border-radius: 4px;
      position: relative;
    }
    .hint.info {
      background-color: #e7f2fa;
      border-color: #2196f3;
    }
    .hint.warning {
      background-color: #fff4e5;
      border-color: #ff9800;
    }
    .hint.danger {
      background-color: #ffebee;
      border-color: #f44336;
    }
    .hint.success {
      background-color: #e8f5e9;
      border-color: #4caf50;
    }
    /* Feature videos on the release-notes pages */
    .release-video {
      display: block;
      width: 100%;
      max-width: 960px;
      margin: 1em 0 1.5em;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      background: #000;
    }
    /* Collapsible sidebar sections (see the sidebar plugin below) */
    .sidebar-nav li.sb-section > .sb-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      margin: 0;
      padding: 6px 0 4px;
      font-weight: 600;
      color: #2c3e50;
    }
    .sidebar-nav li.sb-section > .sb-toggle:hover { color: var(--theme-color, #42b983); }
    .sidebar-nav li.sb-section > .sb-toggle::before {
      content: '';
      flex: none;
      width: 0;
      height: 0;
      border-left: 5px solid currentColor;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transition: transform 0.15s ease;
      opacity: 0.7;
    }
    .sidebar-nav li.sb-section.sb-open > .sb-toggle::before { transform: rotate(90deg); }
    .sidebar-nav li.sb-section > .sb-toggle strong { font-weight: inherit; }
    .sidebar-nav li.sb-section:not(.sb-open) > ul { display: none; }
    .sidebar-nav li.sb-section.sb-has-active > .sb-toggle { color: var(--theme-color, #42b983); }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    // Languages published besides English (folder name = ISO code used by the backoffice).
    var LANGS = ['de'];

    // No cover page: a bare URL lands on the README route (and /de/ on the German one).
    (function () {
      var h = location.hash.replace(/\?.*$/, '');
      if (h === '' || h === '#' || h === '#/') location.replace('#/README');
      else if (/^#\/[a-z]{2}(-[a-z]+)?\/?$/.test(h) && LANGS.indexOf(h.replace(/^#\/|\/$/g, '')) !== -1) location.replace(h.replace(/\/?$/, '/README'));
    })();

    window.$docsify = {
      name: 'CircuitAuction Docs',
      nameLink: { '/de/': '#/de/README', '/': '#/README' },
      loadSidebar: true,
      loadNavbar: true,
      autoHeader: true,
      subMaxLevel: 3,
      maxLevel: 4,
      homepage: 'README.md',

      // Serve the English page when a translated one does not exist (yet).
      fallbackLanguages: LANGS,

      // Order matters: the language rule must come before the generic one,
      // otherwise /de/_sidebar.md is aliased to the English sidebar.
      alias: {
        '/de/(.*/)?_sidebar.md': '/de/_sidebar.md',
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },

      search: {
        maxAge: 86400000,
        paths: 'auto',
        pathNamespaces: LANGS.map(function (l) { return '/' + l; }),
        placeholder: { '/de/': 'Suchen...', '/': 'Search...' },
        noData: { '/de/': 'Keine Ergebnisse', '/': 'No Results!' },
        depth: 6,
        hideOtherSidebarContent: false
      },

      pagination: {
        previousText: { '/de/': 'Zurück', '/': 'Previous' },
        nextText: { '/de/': 'Weiter', '/': 'Next' },
        crossChapter: true,
        crossChapterText: true,
      },

      copyCode: {
        buttonText: { '/de/': 'Kopieren', '/': 'Copy' },
        errorText: { '/de/': 'Fehler', '/': 'Error' },
        successText: { '/de/': 'Kopiert', '/': 'Copied' }
      },

      // Process GitBook hint blocks
      plugins: [
        function(hook, vm) {
          hook.afterEach(function(html) {
            // Convert GitBook {% hint %} blocks to styled divs.
            // Marked may escape " to &quot; and wrap markers in <p> tags,
            // so the regex tolerates both forms and strips the surrounding <p>.
            html = html.replace(
              /(?:<p>\s*)?\{%\s*hint\s+style=(?:"|&quot;)(\w+)(?:"|&quot;)\s*%\}(?:\s*<\/p>)?([\s\S]*?)(?:<p>\s*)?\{%\s*endhint\s*%\}(?:\s*<\/p>)?/g,
              function(match, style, content) {
                return '<div class="hint ' + style + '">' + content.trim() + '</div>';
              }
            );
            return html;
          });
        },
        // i18n: <html lang/dir> follows the route, and the navbar language links
        // keep the current page instead of jumping to the language home.
        function (hook, vm) {
          var RTL = ['he'];
          function langOf(path) {
            var m = path.match(/^\/([a-z]{2}(?:-[a-z]+)?)(?:\/|$)/);
            return m && LANGS.indexOf(m[1]) !== -1 ? m[1] : '';
          }
          // Under a /<lang>/ route docsify resolves image links against the ROUTE's parent
          // folder, not the markdown file, and keeps only links containing `:` or `//` as
          // they are (a leading `/` is still relative). Fallback pages (English text served
          // from fallbackLanguages) keep the /de/ route, so their `../assets/x.png` would
          // end up in /de/assets/. Normalise every asset link to the depth-correct relative
          // form: one `../` per folder of the route's parent path (`/de/tasks` -> 1,
          // `/de/auction/x` -> 2), which resolves to the site-root assets folder.
          hook.beforeEach(function (md) {
            var path = vm.route.path || '/';
            if (!langOf(path)) return md;
            var segs = path.split('/').filter(Boolean);
            if (path.slice(-1) !== '/') segs.pop();
            var up = new Array(segs.length + 1).join('../');
            return md
              .replace(/\]\((<?)(?:\.\.\/|\/)*((?:\.gitbook\/)?assets\/)/g, function (m, lt, p) { return '](' + lt + up + p; })
              .replace(/(src=["'])(?:\.\.\/|\/)*((?:\.gitbook\/)?assets\/)/g, function (m, q, p) { return q + up + p; });
          });
          // Localized screenshots: on a /<lang>/ route point every app screenshot at
          // assets/screenshots/<lang>/<name>; when that capture does not exist, onerror
          // swaps back (once) to the English file, so there is never a broken image.
          // Done on the rendered HTML (before the zoom-image plugin binds in doneEach).
          hook.afterEach(function (html) {
            var cur = langOf(vm.route.path || '/');
            if (!cur) return html;
            return html.replace(
              /(<img\b[^>]*?\ssrc=")([^"]*?assets\/screenshots\/)([\w.%() -]+)"/g,
              function (m, pre, dir, name) {
                var orig = dir + name;
                return pre + dir + cur + '/' + name + '" onerror="this.onerror=null;this.src=\'' +
                  orig.replace(/'/g, '%27') + '\'"';
              }
            );
          });
          hook.doneEach(function () {
            var path = vm.route.path || '/';
            var cur = langOf(path);
            var rest = cur ? path.slice(cur.length + 1) || '/' : path;
            document.documentElement.lang = cur || 'en';
            document.documentElement.dir = RTL.indexOf(cur) !== -1 ? 'rtl' : 'ltr';
            document.querySelectorAll('.app-nav a').forEach(function (a) {
              var m = (a.getAttribute('href') || '').match(/^#\/([a-z]{2}(?:-[a-z]+)?)?\/?$/);
              if (!m) return;
              var target = m[1] || '';
              if (target && LANGS.indexOf(target) === -1) return;
              a.setAttribute('href', '#' + (target ? '/' + target : '') + rest);
            });
          });
        },

        // Sidebar: collapsible sections + no jump to the top while the page scrolls.
        function (hook, vm) {
          // Open/closed state per section label, kept for the visit and across visits.
          var KEY = 'ca-docs-sidebar-open';
          var state = {};
          try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
          function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

          function sectionKey(li) {
            var parts = [];
            for (var n = li; n && n.classList; n = n.parentElement && n.parentElement.closest('li.sb-section')) {
              var label = n.querySelector(':scope > .sb-toggle');
              parts.unshift(label ? label.textContent.trim() : '');
            }
            var m = (vm.route.path || '/').match(/^\/([a-z]{2}(?:-[a-z]+)?)(?:\/|$)/);
            var lang = m && LANGS.indexOf(m[1]) !== -1 ? m[1] : 'en';
            return lang + ':' + parts.join(' / ');
          }

          function setOpen(li, open) {
            li.classList.toggle('sb-open', open);
            var t = li.querySelector(':scope > .sb-toggle');
            if (t) t.setAttribute('aria-expanded', open ? 'true' : 'false');
          }

          function build() {
            var nav = document.querySelector('.sidebar-nav');
            if (!nav) return;
            nav.querySelectorAll('li').forEach(function (li) {
              if (li.classList.contains('sb-section')) return;
              var sub = li.querySelector(':scope > ul');
              if (!sub) return;
              // A section is a list item whose label is bold text (not a page link).
              var label = li.querySelector(':scope > strong, :scope > p');
              if (!label || label.querySelector('a') || !label.textContent.trim()) return;
              if (label.tagName === 'P' && !label.querySelector('strong')) return;
              var toggle = document.createElement('div');
              toggle.className = 'sb-toggle';
              toggle.setAttribute('role', 'button');
              toggle.setAttribute('tabindex', '0');
              li.insertBefore(toggle, label);
              toggle.appendChild(label.tagName === 'P' ? label.querySelector('strong') : label);
              if (label.tagName === 'P') label.remove();
              li.classList.add('sb-section');
            });
            sync();
          }

          // Section containing the current page opens; others keep their saved state.
          function sync() {
            var active = document.querySelector('.sidebar-nav li.active');
            document.querySelectorAll('.sidebar-nav li.sb-section').forEach(function (li) {
              var has = !!(active && li.contains(active));
              li.classList.toggle('sb-has-active', has);
              var key = sectionKey(li);
              setOpen(li, has || state[key] === true);
            });
          }

          document.addEventListener('click', function (e) {
            var t = e.target.closest && e.target.closest('.sidebar-nav .sb-toggle');
            if (!t) return;
            e.preventDefault();
            var li = t.parentElement;
            var open = !li.classList.contains('sb-open');
            setOpen(li, open);
            state[sectionKey(li)] = open;
            save();
          });
          document.addEventListener('keydown', function (e) {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sb-toggle')) {
              e.preventDefault();
              e.target.click();
            }
          });

          // docsify 4's scroll highlighter compares the active item with the wrong
          // element and resets the sidebar to the top while the content scrolls.
          // Remember the sidebar position before its handler runs (capture phase),
          // put it back afterwards, and only scroll when the active item is hidden.
          var saved = null;
          window.addEventListener('scroll', function () {
            var sb = document.querySelector('.sidebar');
            if (sb) saved = sb.scrollTop;
          }, true);
          window.addEventListener('scroll', function () {
            var sb = document.querySelector('.sidebar');
            if (!sb || saved === null) return;
            var want = saved;
            requestAnimationFrame(function () {
              if (sb.scrollTop !== want) sb.scrollTop = want;
              var active = sb.querySelector('li.active');
              if (!active || !active.offsetParent) return;
              var r = active.getBoundingClientRect();
              var box = sb.getBoundingClientRect();
              if (r.top < box.top + 40) sb.scrollTop -= (box.top + 40 - r.top);
              else if (r.bottom > box.bottom - 40) sb.scrollTop += (r.bottom - box.bottom + 40);
            });
          });

          hook.doneEach(build);
        }
      ]
    }
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Copy code plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>

  <!-- Pagination plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Zoom image plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

  <!-- Emoji plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
